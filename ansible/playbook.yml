---
- name: Deploiement de l'application meteo Flask sur la VM OpenStack
  hosts: openstack_vms
  become: true
  gather_facts: false

  vars:
    app_port: 5000
    app_dir: /opt/webapp
    app_user: ubuntu

  pre_tasks:
    - name: Attendre que la VM soit joignable (fin de cloud-init)
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

  tasks:
    - name: Mise a jour de l'index des paquets
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installation de Python, pip et venv
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present

    - name: Creation du repertoire de l'application
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Copie du code de l'application
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/"
        dest: "{{ app_dir }}/"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
      notify: Redemarrer webapp

    - name: Installation des dependances dans un virtualenv
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
        virtualenv_command: python3 -m venv

    - name: Installation du service systemd
      ansible.builtin.copy:
        dest: /etc/systemd/system/webapp.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Application meteo Flask
          After=network-online.target
          Wants=network-online.target

          [Service]
          User={{ app_user }}
          WorkingDirectory={{ app_dir }}
          ExecStart={{ app_dir }}/venv/bin/gunicorn -w 2 -b 0.0.0.0:{{ app_port }} app:app
          Restart=always

          [Install]
          WantedBy=multi-user.target
      notify: Redemarrer webapp

    - name: Demarrage et activation du service
      ansible.builtin.systemd:
        name: webapp
        state: started
        enabled: true
        daemon_reload: true

    - name: Appliquer les redemarrages en attente
      ansible.builtin.meta: flush_handlers

    - name: Verification de l'accessibilite (port {{ app_port }})
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/health"
        status_code: 200
      register: health
      retries: 10
      delay: 5
      until: health.status == 200

  handlers:
    - name: Redemarrer webapp
      ansible.builtin.systemd:
        name: webapp
        state: restarted
        daemon_reload: true
